name: Smoke test Isagi runtime

on:
  push:
    branches:
      - feature/isagi-yoichi

jobs:
  smoke:
    if: github.event.head_commit.message == 'Smoke test Isagi runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/isagi-yoichi
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Isagi battle smoke
        run: |
          node - <<'NODE'
          const {openGame}=require('./tools/probe');
          (async()=>{
            const {browser,page,errors}=await openGame('isagi','chichi');
            try{
              const before=await page.evaluate(()=>{
                const f=window.__G().fighters.find(x=>x.key==='isagi');
                if(!f) throw new Error('Isagi did not spawn');
                return {vision:f.vision,hp:f.hp,shot:!!f.isagiShot,meta:f.isagiMeta||0};
              });
              await page.evaluate(()=>{ for(let i=0;i<1800&&!window.__G().over;i++) window.__step(1/60); });
              const after=await page.evaluate(()=>{
                const g=window.__G(),f=g.fighters.find(x=>x.key==='isagi');
                return {vision:f.vision,hp:f.hp,shot:!!f.isagiShot,meta:f.isagiMeta||0,over:!!g.over,t:g.t};
              });
              if(errors.length) throw new Error('page errors: '+errors.join(' | '));
              if(before.vision!==15) throw new Error('Vision did not start at 15: '+JSON.stringify(before));
              if(after.t<=0) throw new Error('battle did not advance');
              if(after.vision===15 && !after.meta && !after.over) throw new Error('Isagi never gained/spent Vision: '+JSON.stringify(after));
              console.log('ISAGI RUNTIME PASS', {before,after});
            } finally { await browser.close(); }
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
