    const S=f.isagiSidestep; S.t-=dt; f.lock=Math.max(f.lock,.06);
    if(!isagiHardCC(f)){ const sp=f.speed*2.0; f.x=clamp(f.x+S.vx*sp*dt,PAD+22,W-PAD-22); f.y=clamp(f.y+S.vy*sp*dt,PAD+55,H-PAD-22); }
    if(S.t<=0)f.isagiSidestep=null;
  }
  if(f.isagiBlind){
    const B=f.isagiBlind; B.t-=dt; f.lock=Math.max(f.lock,.06);
    if(!isagiHardCC(f)){ const sp=f.speed*ISAGI.blindMove; f.x=clamp(f.x+B.vx*sp*dt,PAD+22,W-PAD-22); f.y=clamp(f.y+B.vy*sp*dt,PAD+55,H-PAD-22); }
    if(B.t<=0){ f.isagiBlind=null; f.isagiFirst=ISAGI.firstT; if(B.target&&B.target.alive)aim(f,B.target,.1); }
  }
  if(f.isagiAct){
    const A=f.isagiAct; A.t+=dt;
    if(A.kind==='analysis'){
      f.moveMul*=ISAGI.puzzleMove;
      if(isagiHardCC(f)){ f.isagiAct=null; return; }
