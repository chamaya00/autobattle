name: Apply Isagi Yoichi fighter

on:
  push:
    branches: [feature/isagi-yoichi]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Isagi Yoichi fighter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/isagi-yoichi
      - name: Build Isagi Yoichi
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()

          def once(old,new,label):
              global s
              assert old in s, f'{label} anchor not found'
              s=s.replace(old,new,1)

          # Shared roster plumbing: Isagi keeps the game's globally adjustable HP system.
          once("const SPR={stages:{},kono:{},chichi:{},tsubasa:{},shika:{},suzune:{},ginyu:{},dora:{},superman:{},beatrice:{},tanjiro:{},gojo:{},conan:{},ayanokouji:{}",
               "const SPR={stages:{},kono:{},chichi:{},tsubasa:{},shika:{},suzune:{},ginyu:{},dora:{},superman:{},beatrice:{},tanjiro:{},gojo:{},conan:{},isagi:{},ayanokouji:{}",
               'SPR')
          once("conan:'#4B8BFF'};","conan:'#4B8BFF',isagi:'#16C7FF'};",'COLORS')
          once("gojo:HP_STD,conan:HP_STD};","gojo:HP_STD,conan:HP_STD,isagi:HP_STD};",'HP')

          isagi_const=r'''

/* ---------- Isagi Yoichi ----------
   Tactical Finisher / Adaptive Striker. Maximum HP deliberately stays OUT of this
   object: mkChar() reads HP.isagi so the shared HP setting keeps working. All visible
   Isagi copy is English. Timings use player seconds through gs(). */
const ISAGI={
  visionMax:100, visionStart:15, visionPerSec:30, visionLock:gs(1.5), observeRange:460,
  metaT:gs(4), metaMove:1.40, metaUltWait:gs(2), metaRecalc:gs(.25),
  basicDmg:14, basicCd:gs(1.1), basicStagger:gs(.15), basicSpeed:500, basicRange:355, basicVision:5,
  firstDmg:38, firstT:gs(2), firstSpeed:610, firstVision:10, firstKb:245,
  blindCd:gs(6), blindT:gs(1), blindMove:2.20, blindTake:.60, blindVision:8,
  directDmg:72, directPerfect:96, directCd:gs(7), directWind:gs(.6), directSpeed:650,
  directRange:390, directVision:12, directStagger:gs(.45), directDown:gs(.8), directKb:330,
  puzzleCd:gs(9), puzzleT:gs(1), puzzleMove:.60, puzzleVision:30, analyzedT:gs(6), analyzedBonus:8, analyzedBonusMax:2,
  allyVision:6, allyVisionCd:gs(1.5),
  ballReturn:gs(.35),
  ultRange:500, ultWind:gs(1.1), ultArmor:gs(.35), ultDmg:160, ultDevour:190, ultPierce:.20,
  ultDown:gs(1.2), ultDevourDown:gs(1.5), ultSpeed:760, ultKb:560,
  midMin:170, midMax:285
};
'''
          once("\nconst CHARS={",isagi_const+"\nconst CHARS={",'ISAGI constants')

          isagi_char=r'''  isagi:{
    name:'Isagi Yoichi', short:'Isagi', tag:'Tactical Finisher · Adaptive Striker', emoji:'🧩', color:'#16C7FF', alt:'#EAFBFF',
    role:'ranged', want:225, speed:102, dodge:.68, male:true, spriteH:116,
    skills:[
      `<b>Passive · Spatial Awareness</b> Vision Gauge starts at ${ISAGI.visionStart}/${ISAGI.visionMax} and never fills by time alone. Controlled Shot +${ISAGI.basicVision}, observed enemy Active Skill +10, a successful read/dodge +8, Direct Shot +${ISAGI.directVision}, Puzzle Pieces +${ISAGI.puzzleVision}, ally-created control +${ISAGI.allyVision}. Vision gain is capped at ${ISAGI.visionPerSec} per second.`,
      `<b>100 Vision · Metavision</b> Up to ${rts(ISAGI.metaT)}s: +40% movement, tactical target selection, a visible Goal Route and Critical Space, and the first eligible direct attack can be read and sidestepped. It never auto-dodges ultimates, area attacks or damage already on the ground.`,
      `<b>Basic · Controlled Shot</b> ${ISAGI.basicDmg} damage every ${rts(ISAGI.basicCd)}s, slight tracking, light ${rts(ISAGI.basicStagger)}s hit-stagger and +${ISAGI.basicVision} Vision. Blind Spot Run upgrades the next basic for ${rts(ISAGI.firstT)}s into <b>First-Touch Shot</b>: ${ISAGI.firstDmg} damage, +${ISAGI.firstVision} Vision and light knockback.`,
      `<b>1 · Blind Spot Run</b> ${rts(ISAGI.blindCd)}s cooldown · a real ${rts(ISAGI.blindT)}s flank run, no teleport: +120% movement, −40% damage taken, ignores slow but not stun/freeze/knockdown. A successful missed attack during the run feeds his read and primes First-Touch Shot.`,
      `<b>2 · Direct Shot</b> ${ISAGI.directDmg} damage · ${rts(ISAGI.directCd)}s cooldown · ${rts(ISAGI.directWind)}s wind-up · +${ISAGI.directVision} Vision on hit. Recovery, stun/knockdown, facing away or a recent miss creates <b>Perfect Timing</b>: ${ISAGI.directPerfect} damage, faster ball and ${rts(ISAGI.directDown)}s knockdown.`,
      `<b>3 · Puzzle Pieces</b> ${rts(ISAGI.puzzleCd)}s cooldown · analyzes for ${rts(ISAGI.puzzleT)}s while moving at 60%, then +${ISAGI.puzzleVision} Vision and <b>Analyzed</b> for ${rts(ISAGI.analyzedT)}s. The next two Active Skills from that target feed +${ISAGI.analyzedBonus} extra Vision, and the first eligible straight attack can be sidestepped.`,
      `<b>Ultimate · Two-Gun Volley</b> Requires 100 Vision + Metavision. Isagi reads a Critical Space for up to ${rts(ISAGI.metaUltWait)}s, then fires for ${ISAGI.ultDmg} damage with 20% defense penetration and ${rts(ISAGI.ultDown)}s knockdown. Analyzed/controlled/recovering targets become <b>Devoured Opportunity</b>: ${ISAGI.ultDevour} damage and ${rts(ISAGI.ultDevourDown)}s knockdown. The shot spends all Vision even if it is dodged or blocked.`
    ],
    init(f){
      f.cds={s1:gs(1.5),s2:gs(2.4),s3:gs(1),s4:0,basic:0};
      f.vision=ISAGI.visionStart; f.isagiVisionSecT=0; f.isagiVisionSecGain=0; f.isagiVisionLock=0;
      f.isagiSeenSkills=new Map(); f.isagiAnalyzed=new Map(); f.isagiMissedBy=new Map(); f.isagiTeamSeen=new Map();
      f.isagiTeamCd=0; f.isagiMeta=0; f.isagiMetaWait=0; f.isagiMetaDodge=true; f.isagiMetaTarget=null;
      f.isagiCritical=null; f.isagiCriticalRecalc=0; f.isagiAct=null; f.isagiBlind=null; f.isagiSidestep=null;
      f.isagiFirst=0; f.isagiShot=null; f.isagiBallReturn=0; f.isagiPuzzlePulse=0; f.isagiHitAt=-99;
    },
    think(f,e,d,auto){
      if(f.isagiAct||f.isagiBlind||f.isagiSidestep)return;
      e=isagiBestNormalTarget(f)||e; if(!e)return; d=dist(f,e);
      const use=k=>auto||keys[k];
      if(f.isagiMeta>0){
        if((!auto&&keys['u'])&&isagiBallReady(f)) isagiUltimate(f,isagiBestTarget(f)||e);
        return;
      }
      if(f.cds.s3<=0&&f.vision<70&&use('l')){ f.cds.s3=ISAGI.puzzleCd; isagiPuzzle(f,e); return; }
      const threat=isagiFacing(f,e)||isagiPreparing(e);
      if(f.cds.s1<=0&&threat&&use('j')){ f.cds.s1=ISAGI.blindCd; isagiBlindSpot(f,e); return; }
      if(f.cds.s2<=0&&d<=ISAGI.directRange&&isagiBallReady(f)&&(isagiOpportunity(f,e)||auto||keys['k'])){
        f.cds.s2=ISAGI.directCd; isagiDirect(f,e); return;
      }
      if(f.cds.basic<=0&&d<=ISAGI.basicRange&&isagiBallReady(f)&&(auto||keys['j'])){ isagiBasic(f,e); return; }
      if(!auto&&f.cds.s1<=0&&keys['j']){ f.cds.s1=ISAGI.blindCd; isagiBlindSpot(f,e); }
    },
    gauge:f=>{
      if(f.isagiMeta>0) return {pct:1,fill:'#16C7FF',txt:`METAVISION · ${(f.isagiMeta*RT).toFixed(1)}s`};
      return {pct:clamp((f.vision||0)/ISAGI.visionMax,0,1),fill:'#16C7FF',txt:`Vision Gauge: ${Math.round(f.vision||0)}/${ISAGI.visionMax}`};
    }
  },
'''
          once("const CHARS={\n  kono:{","const CHARS={\n"+isagi_char+"  kono:{",'CHARS Isagi')

          isagi_dex=r'''  isagi:{ role:{vi:'Tactical Finisher · Adaptive Striker',en:'Tactical Finisher · Adaptive Striker'}, st:{pow:4,spd:4,rng:4,def:2},
    pw:{dmg:72,dur:42,mob:88,as:68,rng:76,cc:58,uti:96,con:74,cmb:38},
    bio:{vi:'Reads the field, builds Vision, finds Critical Space and converts one opening into a goal.',
         en:'Reads the field, builds Vision, finds Critical Space and converts one opening into a goal.'},
    skills:[
      {tag:'P',name:'Spatial Awareness',vi:'Vision comes from information, not time. Gain is capped at 30 per second and stops while hard-controlled.',en:'Vision comes from information, not time. Gain is capped at 30 per second and stops while hard-controlled.'},
      {tag:'100',name:'Metavision',vi:'At 100 Vision, reveals Critical Space, speeds movement and reads the first eligible direct attack before the finish.',en:'At 100 Vision, reveals Critical Space, speeds movement and reads the first eligible direct attack before the finish.'},
      {tag:'1',name:'Blind Spot Run',vi:'A real flank run with damage reduction and slow immunity; primes First-Touch Shot.',en:'A real flank run with damage reduction and slow immunity; primes First-Touch Shot.'},
      {tag:'2',name:'Direct Shot',vi:'72 damage. Perfect Timing turns a genuine opening into 96 damage and a knockdown.',en:'72 damage. Perfect Timing turns a genuine opening into 96 damage and a knockdown.'},
      {tag:'3',name:'Puzzle Pieces',vi:'Analyze for 1s, gain 30 Vision and mark the target Analyzed for 6s.',en:'Analyze for 1s, gain 30 Vision and mark the target Analyzed for 6s.'},
      {tag:'U',name:'Two-Gun Volley',vi:'Metavision finisher: 160 with 20% defense penetration, or 190 as Devoured Opportunity.',en:'Metavision finisher: 160 with 20% defense penetration, or 190 as Devoured Opportunity.'}
    ]},
'''
          once("const DEX={\n  kono:","const DEX={\n"+isagi_dex+"  kono:",'DEX Isagi')

          helpers=r'''
/* ---------- Isagi Yoichi ---------- */
const isagiHardCC=f=>!!f&&(f.stun>0||f.infoOverload>0||f.conanSleep>0||f.frozen>0);
const isagiBallReady=f=>!!f&&!f.isagiShot&&(f.isagiBallReturn||0)<=0;
function isagiGainVision(f,n,reason){
  if(!f||f.key!=='isagi'||f.swapAs||!f.alive||f.isagiVisionLock>0||isagiHardCC(f))return 0;
  const cap=Math.max(0,ISAGI.visionPerSec-(f.isagiVisionSecGain||0));
  const add=Math.max(0,Math.min(n,cap,ISAGI.visionMax-(f.vision||0)));
  if(add<=0)return 0;
  const before=f.vision||0; f.vision=before+add; f.isagiVisionSecGain=(f.isagiVisionSecGain||0)+add;
  for(const mark of [25,50,75]) if(before<mark&&f.vision>=mark){ f.isagiPuzzlePulse=.75; if(mark===50)sfx('stun'); }
  if(reason) G.floats.push({x:f.x+rnd(-24,24),y:f.y-92,txt:`VISION +${Math.round(add)}`,color:'#8BEAFF',life:.72,ml:.72,sc:.45});
  if(f.vision>=ISAGI.visionMax&&!f.isagiMeta) isagiStartMeta(f);
  return add;
}
function isagiStartMeta(f){
  if(!f||!f.alive)return;
  f.vision=ISAGI.visionMax; f.isagiMeta=ISAGI.metaT; f.isagiMetaWait=0; f.isagiMetaDodge=true;
  f.isagiMetaTarget=isagiBestTarget(f)||nearestFoe(f); f.isagiCritical=isagiCriticalSpace(f,f.isagiMetaTarget);
  f.isagiCriticalRecalc=ISAGI.metaRecalc; f.isagiPuzzlePulse=ISAGI.metaT;
  G.floats.push({x:f.x,y:f.y-118,txt:'METAVISION',color:'#16C7FF',life:1.25,ml:1.25,banner:true,gold:true,sc:.62});
  ring(f.x,f.y,105,'#16C7FF',.42); sfx('stun');
}
function isagiOnDodge(f,src){
  if(!f||f.key!=='isagi'||f.swapAs)return;
  if(src)f.isagiMissedBy.set(src,G.t);
  isagiGainVision(f,ISAGI.blindVision,'DODGE READ');
  if(f.isagiBlind)f.isagiBlind.missed=true;
  if(src&&src.lastHitBy&&src.lastHitBy.team===f.team&&src.lastHitBy!==f&&G.t-(src.lastHitAt||-99)<=gs(1.5)&&f.isagiTeamCd<=0){
    f.isagiTeamCd=ISAGI.allyVisionCd; isagiGainVision(f,ISAGI.allyVision,'TEAM OPENING');
  }
}
function isagiSidePoint(f,src,distSide=82){
  if(!src)return null;
  const dx=src.x-f.x,dy=src.y-f.y,m=Math.hypot(dx,dy)||1;
  let px=-dy/m,py=dx/m;
  const a={x:clamp(f.x+px*distSide,PAD+24,W-PAD-24),y:clamp(f.y+py*distSide,PAD+58,H-PAD-24)};
  const b={x:clamp(f.x-px*distSide,PAD+24,W-PAD-24),y:clamp(f.y-py*distSide,PAD+58,H-PAD-24)};
  const crowd=q=>G.fighters.reduce((z,o)=>z+(o!==f&&o.alive&&Math.hypot(o.x-q.x,o.y-q.y)<86?1:0),0);
  const q=crowd(a)<=crowd(b)?a:b;
  return Math.hypot(q.x-f.x,q.y-f.y)>18?q:null;
}
function isagiStartSidestep(f,src){
  const q=isagiSidePoint(f,src,72); if(!q)return false;
  const dx=q.x-f.x,dy=q.y-f.y,m=Math.hypot(dx,dy)||1;
  f.isagiSidestep={t:gs(.32),vx:dx/m,vy:dy/m,target:src};
  G.floats.push({x:f.x,y:f.y-96,txt:'READ',color:'#8BEAFF',life:.6,ml:.6,banner:true,sc:.45});
  return true;
}
function isagiReadDodge(t,src,kind){
  if(!t||t.key!=='isagi'||t.swapAs||!src||src.team===t.team||isagiHardCC(t))return false;
  if(t.isagiAct&&(t.isagiAct.kind==='direct'||t.isagiAct.kind==='ultimate'))return false;
  if(kind==='ult'||kind==='domain'||kind==='dot'||kind==='reflect'||kind==='big'||kind==='explosion')return false;
  let ok=false;
  if(t.isagiMeta>0&&t.isagiMetaDodge&&(!t.isagiMetaTarget||src===t.isagiMetaTarget)){ t.isagiMetaDodge=false; ok=true; }
  const an=t.isagiAnalyzed&&t.isagiAnalyzed.get(src);
  if(!ok&&an&&an.left>0&&!an.dodgeUsed){ an.dodgeUsed=true; ok=true; }
  if(!ok)return false;
  if(!isagiStartSidestep(t,src))return false;
  isagiOnDodge(t,src); return true;
}
function isagiFacing(f,t){
  if(!f||!t)return false;
  const toward=Math.sign(f.x-t.x)||1;
  return (t.face||1)===toward;
}
function isagiPreparing(t){
  if(!t)return false;
  return t.pose==='atk1'||t.pose==='atk2'||t.pose==='ultimate'||!!t.gojoAct||!!t.tanAct||!!t.drAim||!!t.gnFlash;
}
function isagiOpportunity(f,t){
  if(!t)return false;
  const recent=(f.isagiMissedBy&&f.isagiMissedBy.has(t))?G.t-f.isagiMissedBy.get(t)<=gs(1.5):false;
  return t.stun>0||t.pose==='hurt'||t.pose==='down'||t.recoil>.15||!isagiFacing(f,t)||recent;
}
function isagiDevoured(f,t){
  const a=f.isagiAnalyzed&&f.isagiAnalyzed.get(t);
  return !!(a&&a.left>0)||isagiOpportunity(f,t);
}
function isagiLineClear(f,t){
  if(!f||!t)return false;
  const ax=f.x,ay=f.y,bx=t.x,by=t.y,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
  for(const o of G.fighters){
    if(!o.alive||o===f||o===t||o.leaving>0)continue;
    const u=clamp(((o.x-ax)*dx+(o.y-ay)*dy)/l2,0,1),x=ax+dx*u,y=ay+dy*u;
    if(Math.hypot(o.x-x,o.y-y)<o.r+10)return false;
  }
  return true;
}
function isagiBestTarget(f){
  const a=G.fighters.filter(o=>foeOk(f,o)&&dist(f,o)<=ISAGI.ultRange);
  if(!a.length)return null;
  a.sort((x,y)=>{
    const hp=(x.hp/x.maxHp)-(y.hp/y.maxHp); if(Math.abs(hp)>.025)return hp;
    const op=Number(isagiOpportunity(f,y))-Number(isagiOpportunity(f,x)); if(op)return op;
    const line=Number(isagiLineClear(f,y))-Number(isagiLineClear(f,x)); if(line)return line;
    return dist(f,x)-dist(f,y);
  });
  return a[0];
}
function isagiBestNormalTarget(f){
  const an=[...(f.isagiAnalyzed||new Map()).entries()].filter(([o,v])=>foeOk(f,o)&&v.left>0).sort((a,b)=>dist(f,a[0])-dist(f,b[0]));
  return an.length?an[0][0]:nearestFoe(f);
}
function isagiCriticalSpace(f,t){
  if(!f||!t)return null;
  const dx=t.x-f.x,dy=t.y-f.y,m=Math.hypot(dx,dy)||1,ux=dx/m,uy=dy/m,px=-uy,py=ux;
  const cand=[1,-1].map(side=>({x:clamp(t.x-ux*165+px*side*120,PAD+45,W-PAD-45),y:clamp(t.y-uy*165+py*side*120,PAD+70,H-PAD-35)}));
  const score=q=>{
    let z=Math.hypot(q.x-f.x)*.015;
    for(const o of G.fighters)if(o.alive&&o!==f&&o!==t){ const d=Math.hypot(o.x-q.x,o.y-q.y); if(d<100)z+=(100-d)*.15; }
    z+=Math.max(0,60-Math.min(q.x-PAD,W-PAD-q.x,q.y-(PAD+45),H-PAD-q.y))*.12;
    return z;
  };
  cand.sort((a,b)=>score(a)-score(b)); return cand[0];
}
function isagiBallReturn(f){
  f.isagiShot=null; f.isagiBallReturn=ISAGI.ballReturn;
}
function isagiFireBall(f,kind,t,opt={}){
  if(!isagiBallReady(f)||!t||!t.alive)return false;
  const srcY=f.y-20,base=Math.atan2((t.y-20)-srcY,t.x-f.x),spread=(f.isagiMeta>0||kind==='ult')?0:rnd(-.035,.035),a=base+spread;
  const sp=opt.speed||ISAGI.basicSpeed;
  f.isagiShot={kind,target:t,x:f.x+Math.cos(a)*24,y:srcY+Math.sin(a)*24,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:12,life:gs(2.4),age:0,perfect:!!opt.perfect,devoured:!!opt.devoured,adjusted:false};
  setPose(f,'kick',.28); sfx('hit'); return true;
}
function isagiBasic(f,e){
  if(!e||!e.alive||!isagiBallReady(f))return;
  f.cds.basic=ISAGI.basicCd;
  if(f.isagiFirst>0){ f.isagiFirst=0; isagiFireBall(f,'first',e,{speed:ISAGI.firstSpeed}); }
  else isagiFireBall(f,'controlled',e,{speed:ISAGI.basicSpeed});
}
function isagiBlindSpot(f,e){
  if(!e||!e.alive)return;
  const q=isagiSidePoint(f,e,118)||{x:clamp(f.x+(f.x<e.x?-90:90),PAD+24,W-PAD-24),y:f.y};
  const dx=q.x-f.x,dy=q.y-f.y,m=Math.hypot(dx,dy)||1;
  f.isagiBlind={t:ISAGI.blindT,vx:dx/m,vy:dy/m,target:e,missed:false}; setPose(f,'run',ISAGI.blindT); aim(f,e,.1);
}
function isagiDirect(f,e){
  if(!e||!e.alive||!isagiBallReady(f))return;
  f.isagiAct={kind:'direct',t:0,target:e,perfect:isagiOpportunity(f,e)}; setPose(f,'kick',ISAGI.directWind); aim(f,e,.2);
  if(f.isagiAct.perfect)G.floats.push({x:f.x,y:f.y-108,txt:'PERFECT TIMING',color:'#8BEAFF',life:.85,ml:.85,banner:true,gold:true,sc:.52});
}
function isagiPuzzle(f,e){
  if(!e||!e.alive)return;
  f.isagiAct={kind:'analysis',t:0,target:e}; setPose(f,'adjust',ISAGI.puzzleT); aim(f,e,.3);
  G.floats.push({x:f.x,y:f.y-104,txt:'PUZZLE PIECES',color:'#16C7FF',life:.85,ml:.85,banner:true,sc:.52});
}
function isagiUltimate(f,t){
  if(!t||!foeOk(f,t)||f.isagiMeta<=0||f.vision<ISAGI.visionMax||!isagiBallReady(f)||f.isagiAct)return false;
  f.isagiAct={kind:'ultimate',t:0,target:t,devoured:isagiDevoured(f,t),fired:false}; setPose(f,'ultimate',ISAGI.ultWind); aim(f,t,.1);
  G.floats.push({x:f.x,y:f.y-118,txt:'TWO-GUN VOLLEY',color:'#EAFBFF',life:1.05,ml:1.05,banner:true,gold:true,sc:.60});
  return true;
}
function isagiWatchSkills(f){
  if(!f.isagiSeenSkills)return;
  for(const o of G.fighters){
    if(!foeOk(f,o)||dist(f,o)>ISAGI.observeRange||!o.cds)continue;
    let m=f.isagiSeenSkills.get(o); if(!m){ m={}; f.isagiSeenSkills.set(o,m); for(const k in o.cds)m[k]=o.cds[k]||0; continue; }
    let used=false;
    for(const k in o.cds){ const v=o.cds[k]||0,old=m[k]; if(old!==undefined&&v>old+gs(.22))used=true; m[k]=v; }
    if(!used)continue;
    isagiGainVision(f,10,'ACTIVE SKILL');
    const a=f.isagiAnalyzed.get(o); if(a&&a.left>0&&a.bonus<ISAGI.analyzedBonusMax){ a.bonus++; isagiGainVision(f,ISAGI.analyzedBonus,'ANALYZED'); }
  }
}
function isagiTeamWatch(f){
  if(f.isagiTeamCd>0)return;
  for(const o of G.fighters){
    if(!foeOk(f,o)||!o.lastHitBy||o.lastHitBy===f||o.lastHitBy.team!==f.team)continue;
    if(G.t-(o.lastHitAt||-99)>gs(.25))continue;
    if(f.isagiTeamSeen.get(o)===o.lastHitAt)continue;
    const displaced=Math.hypot(o.kbx||0,o.kby||0)>70;
    if(!(o.stun>0||o.pose==='down'||displaced))continue;
    f.isagiTeamSeen.set(o,o.lastHitAt); f.isagiTeamCd=ISAGI.allyVisionCd; isagiGainVision(f,ISAGI.allyVision,'TEAM OPENING'); return;
  }
}
function isagiShotsTick(f,dt){
  const p=f.isagiShot; if(!p)return;
  p.age+=dt; p.life-=dt;
  if(p.kind==='controlled'&&p.target&&p.target.alive){
    const sp=Math.hypot(p.vx,p.vy)||1,want=Math.atan2((p.target.y-20)-p.y,p.target.x-p.x),cur=Math.atan2(p.vy,p.vx),diff=Math.atan2(Math.sin(want-cur),Math.cos(want-cur));
    const tr=clamp(diff,-.75*dt,.75*dt); p.vx=Math.cos(cur+tr)*sp; p.vy=Math.sin(cur+tr)*sp;
  }
  if(p.kind==='ult'&&!p.adjusted&&p.age>=gs(.18)&&p.target&&p.target.alive){
    const sp=Math.hypot(p.vx,p.vy)||ISAGI.ultSpeed,a=Math.atan2((p.target.y-20)-p.y,p.target.x-p.x); p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.adjusted=true;
  }
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.life<=0||p.x<PAD-35||p.x>W-PAD+35||p.y<PAD-30||p.y>H-PAD+30){ isagiBallReturn(f); return; }
  for(const o of G.fighters){
    if(!foeOk(f,o)||!hitsBody(p,o))continue;
    let hit=false;
    if(p.kind==='controlled'){
      hit=hurt(o,ISAGI.basicDmg,f,false,'isagiBasic'); if(hit){stunFx(o,ISAGI.basicStagger,'spark');isagiGainVision(f,ISAGI.basicVision,'CONTROLLED SHOT');}
    }else if(p.kind==='first'){
      hit=hurt(o,ISAGI.firstDmg,f,'FIRST-TOUCH SHOT','isagiFirst'); if(hit){knock(o,p.vx,p.vy,ISAGI.firstKb);isagiGainVision(f,ISAGI.firstVision,'FIRST TOUCH');}
    }else if(p.kind==='direct'){
      const dmg=p.perfect?ISAGI.directPerfect:ISAGI.directDmg;
      hit=hurt(o,dmg,f,p.perfect?'PERFECT TIMING':'DIRECT SHOT','isagiDirect');
      if(hit){ knock(o,p.vx,p.vy,ISAGI.directKb); stunFx(o,p.perfect?ISAGI.directDown:ISAGI.directStagger,p.perfect?'spin':'spark'); isagiGainVision(f,ISAGI.directVision,'DIRECT SHOT'); }
    }else if(p.kind==='ult'){
      const dmg=p.devoured?ISAGI.ultDevour:ISAGI.ultDmg;
      hit=hurt(o,dmg,f,p.devoured?'DEVOURED OPPORTUNITY':'TWO-GUN VOLLEY','isagiUlt');
      if(hit){ knock(o,p.vx,p.vy,ISAGI.ultKb); stunFx(o,p.devoured?ISAGI.ultDevourDown:ISAGI.ultDown,'spin'); ring(o.x,o.y,110,'#16C7FF',.4); }
