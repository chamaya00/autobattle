  if(f.isagiTeamCd>0)f.isagiTeamCd=Math.max(0,f.isagiTeamCd-dt);
  if(f.isagiBallReturn>0)f.isagiBallReturn=Math.max(0,f.isagiBallReturn-dt);
  if(f.isagiFirst>0)f.isagiFirst=Math.max(0,f.isagiFirst-dt);
  if(f.isagiPuzzlePulse>0)f.isagiPuzzlePulse=Math.max(0,f.isagiPuzzlePulse-dt);
  for(const [o,a] of [...f.isagiAnalyzed]){ a.left-=dt; if(a.left<=0||!o.alive)f.isagiAnalyzed.delete(o); }
