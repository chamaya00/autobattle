        f.isagiAct=null; isagiGainVision(f,ISAGI.puzzleVision,'PUZZLE PIECES');
        if(A.target&&A.target.alive){ f.isagiAnalyzed.set(A.target,{left:ISAGI.analyzedT,bonus:0,dodgeUsed:false}); G.floats.push({x:A.target.x,y:A.target.y-108,txt:'ANALYZED',color:'#8BEAFF',life:1,ml:1,banner:true,sc:.52}); }
      }
    }else if(A.kind==='direct'){
      if(isagiHardCC(f)){ f.isagiAct=null; f.isagiBallReturn=0; return; }
      if(A.t>=ISAGI.directWind){
        const t=A.target&&A.target.alive?A.target:nearestFoe(f),perfect=t?isagiOpportunity(f,t):A.perfect;
        f.isagiAct=null; if(t)isagiFireBall(f,'direct',t,{perfect,speed:ISAGI.directSpeed*(perfect?1.25:1)});
      }
    }else if(A.kind==='ultimate'){
      if(isagiHardCC(f)){ f.isagiAct=null; return; }
      if(A.t<ISAGI.ultWind-ISAGI.ultArmor&&G.t-(f.isagiHitAt||-99)<dt*1.6){ f.isagiAct=null; G.floats.push({x:f.x,y:f.y-100,txt:'VOLLEY INTERRUPTED',color:'#D9E6EF',life:.8,ml:.8,banner:true,sc:.45}); return; }
      if(A.t>=ISAGI.ultWind&&!A.fired){
        A.fired=true; const t=A.target&&A.target.alive?A.target:isagiBestTarget(f);
        const dev=t?isagiDevoured(f,t):A.devoured;
        if(t)isagiFireBall(f,'ult',t,{devoured:dev,speed:ISAGI.ultSpeed});
        f.vision=0; f.isagiVisionLock=ISAGI.visionLock; f.isagiMeta=0; f.isagiMetaWait=0; f.isagiCritical=null; f.isagiMetaTarget=null; f.isagiAct=null;
      }
    }
  }
