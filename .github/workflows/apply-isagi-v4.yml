name: Build Isagi Yoichi v4

on:
  push:
    branches:
      - feature/isagi-yoichi

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Run Isagi builder v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/isagi-yoichi
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Apply Isagi fighter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-isagi.yml').read_text()
          a="          python3 - <<'PY'\n"
          b="\n          PY\n          python3 tools/mk_play.py"
          start=src.index(a)+len(a); end=src.index(b,start)
          lines=[line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines()]
          Path('.github/isagi_patch.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 .github/isagi_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="gojo:{},conan:{},isagi:{},ayanokouji:{}"
          new="gojo:{},isagi:{},conan:{},ayanokouji:{}"
          assert old in s, 'sprite ordering anchor not found'
          s=s.replace(old,new,1)
          old="        const turn=Math.min(Math.abs(diff),(p.turn||5.5)*dt)*(diff<0?-1:1);"
          new="        const turnRate=(tg.key==='isagi'&&tg.isagiBlind)?(p.turn||5.5)*.45:(p.turn||5.5);\n        const turn=Math.min(Math.abs(diff),turnRate*dt)*(diff<0?-1:1);"
          assert old in s, 'homing turn anchor not found'
          s=s.replace(old,new,1)
          old="    for(const k in o.cds){ const v=o.cds[k]||0,old=m[k]; if(old!==undefined&&v>old+gs(.22))used=true; m[k]=v; }"
          new="    for(const k in o.cds){ const v=o.cds[k]||0,old=m[k]; if(k!=='basic'&&old!==undefined&&v>old+gs(.22))used=true; m[k]=v; }"
          assert old in s, 'active skill observer anchor not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 tools/mk_play.py
      - name: Validate Isagi
        run: |
          node tools/t_isagi.js
          node tools/t_conan.js
          node tools/t_play.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          for f in ['index.html','play.html']:
              text=Path(f).read_text()
              for js in re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I):
                  fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd)
                  Path(path).write_text(js)
                  subprocess.run(['node','--check',path],check=True,stdout=subprocess.DEVNULL)
                  os.unlink(path)
          PY
      - name: Commit clean fighter change
        run: |
          rm -f .github/isagi_patch.py .github/workflows/inspect-isagi.yml .github/workflows/apply-isagi.yml .github/workflows/apply-isagi-v2.yml .github/workflows/apply-isagi-v3.yml .github/workflows/apply-isagi-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html play.html tools/t_isagi.js .github/workflows/inspect-isagi.yml .github/workflows/apply-isagi.yml .github/workflows/apply-isagi-v2.yml .github/workflows/apply-isagi-v3.yml .github/workflows/apply-isagi-v4.yml
          git commit -m "Add Isagi Yoichi tactical fighter"
          git push origin HEAD:feature/isagi-yoichi
