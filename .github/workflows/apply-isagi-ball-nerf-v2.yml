name: Apply Isagi ball nerf v2

on:
  push:
    branches:
      - balance/isagi-ball-nerf

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Isagi nerf patch v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/isagi-ball-nerf
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Apply patch
        run: |
          python3 .github/isagi_ball_nerf.py
          python3 tools/mk_play.py
      - name: Validate
        run: |
          node tools/t_isagi.js
          node tools/t_conan.js
          node tools/t_play.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          for f in ['index.html','play.html']:
              text=Path(f).read_text()
              for js in re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I):
                  fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd)
                  Path(path).write_text(js)
                  subprocess.run(['node','--check',path],check=True,stdout=subprocess.DEVNULL)
                  os.unlink(path)
          PY
      - name: Commit clean balance change
        run: |
          rm -f .github/isagi_ball_nerf.py .github/workflows/inspect-isagi-ball.yml .github/workflows/inspect-tsubasa-ball-draw.yml .github/workflows/apply-isagi-ball-nerf.yml .github/workflows/apply-isagi-ball-nerf-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Nerf Isagi shot speed and accuracy"
          git push origin HEAD:balance/isagi-ball-nerf
