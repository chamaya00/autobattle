name: Apply Isagi ball nerf

on:
  push:
    branches:
      - balance/isagi-ball-nerf

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Isagi ball nerf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/isagi-ball-nerf
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Patch Isagi balance and football presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          def rep(old,new,label):
              global s
              assert old in s, label+' anchor missing'
              s=s.replace(old,new,1)

          rep("  basicDmg:14, basicCd:gs(1.1), basicStagger:gs(.15), basicSpeed:500, basicRange:355, basicVision:5,",
              "  basicDmg:12, basicCd:gs(2.8), basicStagger:gs(.15), basicSpeed:BALL_SPD*1.02, basicRange:355, basicVision:5,",
              'basic tuning')
          rep("  firstDmg:38, firstT:gs(2), firstSpeed:610, firstVision:10, firstKb:245,",
              "  firstDmg:34, firstT:gs(2), firstSpeed:BALL_SPD*1.05, firstVision:10, firstKb:245,",
              'first touch tuning')
          rep("  directDmg:72, directPerfect:96, directCd:gs(7), directWind:gs(.6), directSpeed:650,",
              "  directDmg:66, directPerfect:86, directCd:gs(7), directWind:gs(.6), directSpeed:BIC_SPD,",
              'direct tuning')
          rep("  ultRange:500, ultWind:gs(1.1), ultArmor:gs(.35), ultDmg:160, ultDevour:190, ultPierce:.20,\n  ultDown:gs(1.2), ultDevourDown:gs(1.5), ultSpeed:760, ultKb:560,",
              "  ultRange:500, ultWind:gs(1.1), ultArmor:gs(.35), ultDmg:145, ultDevour:170, ultPierce:.20,\n  ultDown:gs(1.2), ultDevourDown:gs(1.5), ultSpeed:BIC_SPD*1.03, ultKb:560,",
              'ultimate tuning')

          rep("      `<b>Basic · Controlled Shot</b> ${ISAGI.basicDmg} damage every ${rts(ISAGI.basicCd)}s, slight tracking, light ${rts(ISAGI.basicStagger)}s hit-stagger and +${ISAGI.basicVision} Vision. Blind Spot Run upgrades the next basic for ${rts(ISAGI.firstT)}s into <b>First-Touch Shot</b>: ${ISAGI.firstDmg} damage, +${ISAGI.firstVision} Vision and light knockback.`,",
              "      `<b>Basic · Controlled Shot</b> ${ISAGI.basicDmg} damage every ${rts(ISAGI.basicCd)}s on a fixed football trajectory that can miss moving targets, with light ${rts(ISAGI.basicStagger)}s hit-stagger and +${ISAGI.basicVision} Vision. Blind Spot Run upgrades the next basic for ${rts(ISAGI.firstT)}s into <b>First-Touch Shot</b>: ${ISAGI.firstDmg} damage, +${ISAGI.firstVision} Vision and light knockback.`,",
              'basic copy')
          rep("    pw:{dmg:72,dur:42,mob:88,as:68,rng:76,cc:58,uti:96,con:74,cmb:38},",
              "    pw:{dmg:64,dur:42,mob:88,as:54,rng:74,cc:56,uti:92,con:70,cmb:34},",
              'power chart')
          rep("      {tag:'2',name:'Direct Shot',vi:'72 damage. Perfect Timing turns a genuine opening into 96 damage and a knockdown.',en:'72 damage. Perfect Timing turns a genuine opening into 96 damage and a knockdown.'},",
              "      {tag:'2',name:'Direct Shot',vi:'66 damage. Perfect Timing improves accuracy and turns a genuine opening into 86 damage and a knockdown, but the shot can still miss.',en:'66 damage. Perfect Timing improves accuracy and turns a genuine opening into 86 damage and a knockdown, but the shot can still miss.'},",
              'DEX direct')
          rep("      {tag:'U',name:'Two-Gun Volley',vi:'Metavision finisher: 160 with 20% defense penetration, or 190 as Devoured Opportunity.',en:'Metavision finisher: 160 with 20% defense penetration, or 190 as Devoured Opportunity.'}",
              "      {tag:'U',name:'Two-Gun Volley',vi:'Metavision finisher: 145 with 20% defense penetration, or 170 as Devoured Opportunity. It is highly accurate, not guaranteed.',en:'Metavision finisher: 145 with 20% defense penetration, or 170 as Devoured Opportunity. It is highly accurate, not guaranteed.'}",
              'DEX ult')

          old="""function isagiFireBall(f,kind,t,opt={}){
  if(!isagiBallReady(f)||!t||!t.alive)return false;
  const srcY=f.y-20,base=Math.atan2((t.y-20)-srcY,t.x-f.x),spread=(f.isagiMeta>0||kind==='ult')?0:rnd(-.035,.035),a=base+spread;
  const sp=opt.speed||ISAGI.basicSpeed;
  f.isagiShot={kind,target:t,x:f.x+Math.cos(a)*24,y:srcY+Math.sin(a)*24,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:12,life:gs(2.4),age:0,perfect:!!opt.perfect,devoured:!!opt.devoured,adjusted:false};
  setPose(f,'kick',.28); sfx('hit'); return true;
}"""
          new="""function isagiShotSpread(f,kind,opt={}){
  let center=.28,min=.14,max=.30;
  if(kind==='first'){ center=.38; min=.10; max=.24; }
  else if(kind==='direct'&&opt.perfect){ center=.68; min=.025; max=.09; }
  else if(kind==='direct'){ center=.48; min=.07; max=.19; }
  else if(kind==='ult'&&opt.devoured){ center=.72; min=.02; max=.075; }
  else if(kind==='ult'){ center=.58; min=.04; max=.13; }
  if(f.isagiMeta>0)center=Math.min(.78,center+.05);
  if(chance(center))return rnd(-.025,.025);
  return (chance(.5)?1:-1)*rnd(min,max);
}
function isagiFireBall(f,kind,t,opt={}){
  if(!isagiBallReady(f)||!t||!t.alive)return false;
  const srcY=f.y-20,base=Math.atan2((t.y-20)-srcY,t.x-f.x),spread=isagiShotSpread(f,kind,opt),a=base+spread;
  const sp=opt.speed||ISAGI.basicSpeed;
  const r=kind==='ult'?13:((kind==='direct'||kind==='first')?12:11);
  f.isagiShot={kind,target:t,x:f.x+Math.cos(a)*24,y:srcY+Math.sin(a)*24,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,life:gs(2.4),age:0,spin:rnd(0,6.28),bounce:0,perfect:!!opt.perfect,devoured:!!opt.devoured};
  setPose(f,'kick',.28); sfx('hit'); return true;
}"""
          rep(old,new,'fire ball')

          rep("""  p.age+=dt; p.life-=dt;
  if(p.kind==='controlled'&&p.target&&p.target.alive){
    const sp=Math.hypot(p.vx,p.vy)||1,want=Math.atan2((p.target.y-20)-p.y,p.target.x-p.x),cur=Math.atan2(p.vy,p.vx),diff=Math.atan2(Math.sin(want-cur),Math.cos(want-cur));
    const tr=clamp(diff,-.75*dt,.75*dt); p.vx=Math.cos(cur+tr)*sp; p.vy=Math.sin(cur+tr)*sp;
  }
  if(p.kind==='ult'&&!p.adjusted&&p.age>=gs(.18)&&p.target&&p.target.alive){
    const sp=Math.hypot(p.vx,p.vy)||ISAGI.ultSpeed,a=Math.atan2((p.target.y-20)-p.y,p.target.x-p.x); p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.adjusted=true;
  }
  p.x+=p.vx*dt; p.y+=p.vy*dt;""",
              """  p.age+=dt; p.life-=dt;
  p.spin=(p.spin||0)+dt*(Math.hypot(p.vx,p.vy)||1)/42;
  p.x+=p.vx*dt; p.y+=p.vy*dt;""",
              'remove homing')

          rep("""    if(isagiBallReady(f)){
      ctx.save();ctx.translate(f.x+f.face*16,f.y+15);ctx.fillStyle='#F7FBFF';ctx.strokeStyle='#162435';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#162435';ctx.beginPath();ctx.arc(0,0,2.4,0,7);ctx.fill();ctx.restore();
    }
    const p=f.isagiShot;
    if(p){
      ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#5DEBFF';ctx.lineWidth=p.kind==='ult'?5:2.5;ctx.beginPath();ctx.moveTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#F7FBFF';ctx.strokeStyle='#16344C';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(p.x,p.y,p.kind==='ult'?10:8,0,7);ctx.fill();ctx.stroke();ctx.restore();
    }""",
              """    if(isagiBallReady(f)){
      ctx.save(); ctx.translate(f.x+f.face*17,f.y+15); ballShape(8,G.t*2.2); ctx.restore();
    }
    const p=f.isagiShot;
    if(p){
      ctx.save(); ctx.translate(p.x,p.y);
      const sp=Math.hypot(p.vx,p.vy)||1,ang=Math.atan2(p.vy,p.vx);
      ctx.save(); ctx.rotate(ang); ctx.globalAlpha=.35; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=p.kind==='ult'?4:3; ctx.lineCap='round';
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(-p.r-6,i*p.r*.55); ctx.lineTo(-p.r-24,i*p.r*.75); ctx.stroke(); }
      ctx.restore();
      ballShape(p.r,p.spin*(sp/300));
      ctx.restore();
    }""",
              'football draw')

          p.write_text(s)

          t=Path('tools/t_isagi.js'); q=t.read_text()
          q=q.replace("has('basicDmg:14, basicCd:gs(1.1)','Controlled Shot');","has('basicDmg:12, basicCd:gs(2.8)','Controlled Shot nerf');")
          q=q.replace("has('firstDmg:38, firstT:gs(2)','First-Touch Shot');","has('firstDmg:34, firstT:gs(2)','First-Touch Shot nerf');")
          q=q.replace("has('directDmg:72, directPerfect:96, directCd:gs(7)','Direct / Perfect Timing');","has('directDmg:66, directPerfect:86, directCd:gs(7)','Direct / Perfect Timing nerf');")
          q=q.replace("has('ultDmg:160, ultDevour:190, ultPierce:.20','Two-Gun Volley');","has('ultDmg:145, ultDevour:170, ultPierce:.20','Two-Gun Volley nerf');")
          insert="""has('basicSpeed:BALL_SPD*1.02','basic football speed near Tsubasa');
has('directSpeed:BIC_SPD','Direct Shot speed matches Tsubasa overhead');
has('ultSpeed:BIC_SPD*1.03','ultimate only slightly faster than Tsubasa overhead');
has('function isagiShotSpread','shots have accuracy spread');
has("return (chance(.5)?1:-1)*rnd(min,max);",'shots can miss left or right');
lacks("p.kind==='controlled'&&p.target&&p.target.alive",'Controlled Shot no longer homes');
lacks("p.kind==='ult'&&!p.adjusted",'ultimate no longer retargets in flight');
has('ballShape(p.r,p.spin*(sp/300))','Isagi uses Tsubasa football rendering');
"""
          q=q.replace("has(\"txt:'METAVISION'\",'Metavision UI');",insert+"has(\"txt:'METAVISION'\",'Metavision UI');")
          t.write_text(q)
          PY
          python3 tools/mk_play.py
      - name: Validate
        run: |
          node tools/t_isagi.js
          node tools/t_conan.js
          node tools/t_play.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          for f in ['index.html','play.html']:
              text=Path(f).read_text()
              for js in re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I):
                  fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd)
                  Path(path).write_text(js)
                  subprocess.run(['node','--check',path],check=True,stdout=subprocess.DEVNULL)
                  os.unlink(path)
          PY
      - name: Commit clean balance change
        run: |
          rm -f .github/workflows/inspect-isagi-ball.yml .github/workflows/inspect-tsubasa-ball-draw.yml .github/workflows/apply-isagi-ball-nerf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html play.html tools/t_isagi.js .github/workflows/inspect-isagi-ball.yml .github/workflows/inspect-tsubasa-ball-draw.yml .github/workflows/apply-isagi-ball-nerf.yml
          git commit -m "Nerf Isagi shot speed and accuracy"
          git push origin HEAD:balance/isagi-ball-nerf
