name: One-shot Tanjiro Mark buff

on:
  push:
    branches: [balance/tanjiro-mark-buff]
    paths:
      - '.github/workflows/tanjiro-mark-buff.yml'

permissions:
  contents: write

jobs:
  buff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buff Demon Slayer Mark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path,pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  n=s.count(old)
                  if n < 1: raise SystemExit(f'{path}: missing expected text: {old[:160]!r}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          patch('index.html',[
            ('markHp:.40, markT:gs(.8), markMove:1.25, markAtk:1.20, markCast:1.20,',
             'markHp:.40, markT:gs(.8), markMove:1.25, markAtk:1.25, markCast:1.25,'),
            ('markCcRes:.25, markKbRes:.20,',
             'markCcRes:.25, markKbRes:.20, markRhythmHits:3, markRhythmDmg:18, markRhythmCdCut:gs(.75),'),
            ('`<b>Awakening · Demon Slayer Mark</b> The first time current HP falls below ${Math.round(TAN.markHp*100)}% of <b>Maximum HP</b>: ${rts(TAN.markT)}s awakening, +${Math.round((TAN.markMove-1)*100)}% move speed, +${Math.round((TAN.markAtk-1)*100)}% attack speed, +${Math.round((TAN.markCast-1)*100)}% cast speed, +${Math.round(TAN.markCcRes*100)}% status resistance and +${Math.round(TAN.markKbRes*100)}% knockback resistance. No damage bonus and no healing.`',
             '`<b>Awakening · Demon Slayer Mark</b> The first time current HP falls below ${Math.round(TAN.markHp*100)}% of <b>Maximum HP</b>: ${rts(TAN.markT)}s awakening, +${Math.round((TAN.markMove-1)*100)}% move speed, +${Math.round((TAN.markAtk-1)*100)}% attack speed, +${Math.round((TAN.markCast-1)*100)}% cast speed, +${Math.round(TAN.markCcRes*100)}% status resistance and +${Math.round(TAN.markKbRes*100)}% knockback resistance. While marked, every ${TAN.markRhythmHits} landed non-Ultimate sword hits trigger <b>Hinokami Rhythm</b>: +${TAN.markRhythmDmg} damage and −${rts(TAN.markRhythmCdCut)}s from the remaining cooldown of all three Breathing Forms. No healing.`'),
            ("{tag:'P',name:'Demon Slayer Mark',vi:`Below ${Math.round(TAN.markHp*100)}% Maximum HP, permanently gains move, attack, cast, status and knockback resistance bonuses. Unlocks the Ultimate; grants no healing or direct damage.`,en:`Below ${Math.round(TAN.markHp*100)}% Maximum HP, permanently gains move, attack, cast, status and knockback resistance bonuses. Unlocks the Ultimate; grants no healing or direct damage.`}",
             "{tag:'P',name:'Demon Slayer Mark',vi:`Below ${Math.round(TAN.markHp*100)}% Maximum HP, permanently gains move, attack, cast, status and knockback resistance bonuses and unlocks the Ultimate. Every ${TAN.markRhythmHits} landed non-Ultimate sword hits trigger Hinokami Rhythm for +${TAN.markRhythmDmg} damage and shave ${rts(TAN.markRhythmCdCut)}s from all three Breathing Form cooldowns. No healing.`,en:`Below ${Math.round(TAN.markHp*100)}% Maximum HP, permanently gains move, attack, cast, status and knockback resistance bonuses and unlocks the Ultimate. Every ${TAN.markRhythmHits} landed non-Ultimate sword hits trigger Hinokami Rhythm for +${TAN.markRhythmDmg} damage and shave ${rts(TAN.markRhythmCdCut)}s from all three Breathing Form cooldowns. No healing.`}"),
            ('f.tanThreadCd=TAN.threadCd; f.tanMarked=false; f.tanMarkStarted=false; f.tanMarkAnim=0;',
             'f.tanThreadCd=TAN.threadCd; f.tanMarked=false; f.tanMarkStarted=false; f.tanMarkAnim=0; f.tanMarkHits=0;'),
            ("  say('Demon Slayer Mark awakens — movement, attack, cast and resistance rise. No HP is restored.','g');",
             "  say('Demon Slayer Mark awakens — speed and resistance rise; every three landed sword hits can ignite Hinokami Rhythm. No HP is restored.','g');"),
            ('function tanBasic(f,e){',
             "function tanMarkRhythm(f,e){\n  if(!f||!e||!f.tanMarked||f.tanUlt||f.swapAs)return;\n  f.tanMarkHits=(f.tanMarkHits||0)+1;\n  if(f.tanMarkHits<TAN.markRhythmHits)return;\n  f.tanMarkHits=0;\n  for(const k of ['s1','s2','s3']) f.cds[k]=Math.max(0,(f.cds[k]||0)-TAN.markRhythmCdCut);\n  if(e.alive&&e.hp>0) hurt(e,TAN.markRhythmDmg,f,'HINOKAMI RHYTHM','big');\n  ring(e.x,e.y,92,'#FF7A3D',.35);\n  tanBanner(f,'HINOKAMI RHYTHM','#FF7A3D');\n}\nfunction tanBasic(f,e){"),
            ('  if(landed){\n    sfx(i===2?\'drive\':\'hit\');',
             "  if(landed){\n    tanMarkRhythm(f,e);\n    sfx(i===2?'drive':'hit');"),
            ("        if(hurt(e,TAN.wheelDmg,f,'WATER WHEEL','big')){\n          stunFx(e,TAN.wheelAir,'spin');",
             "        if(hurt(e,TAN.wheelDmg,f,'WATER WHEEL','big')){\n          tanMarkRhythm(f,e);\n          stunFx(e,TAN.wheelAir,'spin');"),
            ("        if(hurt(tg,TAN.fluxHit[A.i],f,last?'CONSTANT FLUX':'', 'big')&&last){\n          knock(tg,tg.x-f.x,tg.y-f.y,TAN.fluxKb); stunFx(tg,TAN.fluxStun,'spin');\n        }",
             "        const landed=hurt(tg,TAN.fluxHit[A.i],f,last?'CONSTANT FLUX':'', 'big');\n        if(landed){\n          tanMarkRhythm(f,tg);\n          if(last){ knock(tg,tg.x-f.x,tg.y-f.y,TAN.fluxKb); stunFx(tg,TAN.fluxStun,'spin'); }\n        }"),
            ("        if(hurt(tg,TAN.sunHit[A.i],f,last?'DRAGON SUN HALO HEAD DANCE':'','big')&&last){\n          knock(tg,tg.x-f.x,tg.y-f.y,TAN.sunKb); stunFx(tg,TAN.sunStun,'spin');\n        }",
             "        const landed=hurt(tg,TAN.sunHit[A.i],f,last?'DRAGON SUN HALO HEAD DANCE':'','big');\n        if(landed){\n          tanMarkRhythm(f,tg);\n          if(last){ knock(tg,tg.x-f.x,tg.y-f.y,TAN.sunKb); stunFx(tg,TAN.sunStun,'spin'); }\n        }"),
            ('      f.tanMarked=true; f.cds.s4=0; f.pose=\'idle\';',
             "      f.tanMarked=true; f.tanMarkHits=0; f.cds.s4=0; f.pose='idle';"),
          ])

          patch('tools/t_tanjiro.js',[
            ('mark: [T.markHp, T.markT * RT, T.markMove, T.markAtk, T.markCast, T.markCcRes, T.markKbRes],',
             'mark: [T.markHp, T.markT * RT, T.markMove, T.markAtk, T.markCast, T.markCcRes, T.markKbRes, T.markRhythmHits, T.markRhythmDmg, T.markRhythmCdCut * RT],'),
            ("'Sun Breathing: Thirteenth Form','Bright Red Nichirin Blade','Regeneration Suppression']",
             "'Sun Breathing: Thirteenth Form','Bright Red Nichirin Blade','Regeneration Suppression','Hinokami Rhythm']"),
            ("console.log('\\n=== 5. Mark uses current maxHp, is permanent and grants no heal/damage ===');",
             "console.log('\\n=== 5. Mark uses current maxHp and powers Hinokami Rhythm ===');"),
            ("    f.stun=0; const cc=window.__stunFx(f,1,'spark');\n    return {exact,started,active:f.tanMarked,hpBefore:before,hpAfter:f.hp,maxHp:f.maxHp,\n      move:f.moveMul,cast:f.castMul,cc,stun:f.stun,ultReady:f.cds.s4===0,\n      directDamageBonus:T.markMove!==undefined && !('markDmg' in T)};",
             "    f.stun=0; const cc=window.__stunFx(f,1,'spark');\n    e.hp=1000;e.maxHp=1000;e.alive=true;e.evade=0;e.dodge=0;e.dmgRes=0;e.dmgTake=1;e.invuln=0;e.openingThreads=[];\n    f.tanRed=0;f.tanCombo=0;f.tanMarkHits=0;f.x=300;f.y=350;e.x=355;e.y=350;\n    f.cds.s1=T.wheelCd;f.cds.s2=T.fluxCd;f.cds.s3=T.sunCd;\n    const h0=e.hp;window.__tanBasic(f,e);window.__tanBasic(f,e);window.__tanBasic(f,e);\n    const rhythmDamage=h0-e.hp,rhythmCds=[f.cds.s1*window.__RT,f.cds.s2*window.__RT,f.cds.s3*window.__RT];\n    return {exact,started,active:f.tanMarked,hpBefore:before,hpAfter:f.hp,maxHp:f.maxHp,\n      move:f.moveMul,cast:f.castMul,cc,stun:f.stun,ultReady:f.cds.s4===0,\n      rhythm:[T.markRhythmHits,T.markRhythmDmg,T.markRhythmCdCut*window.__RT],rhythmDamage,rhythmCds,rhythmStacks:f.tanMarkHits};"),
            ("ok(near(mark.move,1.25) && near(mark.cast,1.2) && mark.cc && near(mark.stun,.75),\n    'Mark grants move/cast and 25% status resistance without a damage stat');",
             "ok(near(mark.move,1.25) && near(mark.cast,1.25) && mark.cc && near(mark.stun,.75),\n    'Mark grants +25% move/cast and 25% status resistance');\n  ok(mark.rhythm.join('/')==='3/18/0.75','Hinokami Rhythm constants are exact',mark.rhythm.join('/'));\n  ok(mark.rhythmDamage===98 && mark.rhythmStacks===0 && mark.rhythmCds.every((x,i)=>near(x,[8.25,13.25,12.25][i],.02)),\n    'three marked basic hits trigger +18 damage and shave 0.75s from all Breathing Form cooldowns',`${mark.rhythmDamage} / ${mark.rhythmCds.map(x=>x.toFixed(2)).join('/')}`);"),
          ])

          patch('CLAUDE.md',[
            ('- Demon Slayer Mark nổ **lần đầu khi `hp < maxHp * .40`**, animation 0.8 giây, không hồi\n  HP/không cộng damage: +25% chạy, +20% nhịp basic, +20% hồi chiêu, 25% kháng hiệu ứng,\n  20% kháng lực đẩy. Sau đó mới mở `Sun Breathing: Thirteenth Form`.',
             '- Demon Slayer Mark nổ **lần đầu khi `hp < maxHp * .40`**, animation 0.8 giây, không hồi\n  HP: +25% chạy, +25% nhịp basic, +25% hồi chiêu, 25% kháng hiệu ứng và 20% kháng lực\n  đẩy. Sau đó mới mở `Sun Breathing: Thirteenth Form`. Khi Mark đang bật, mỗi 3 đòn kiếm\n  **không phải Ultimate** trúng đích kích hoạt `Hinokami Rhythm`: thêm 18 damage và bớt\n  0.75 giây khỏi cooldown còn lại của Water Wheel / Constant Flux / Dragon Sun Halo.\n  Ultimate không tích nhịp này để chuỗi 12 hit không tự snowball.'),
          ])
          PY

          python3 tools/mk_play.py

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          t=Path('tools/t_tanjiro.js').read_text(encoding='utf-8')
          checks=[
            'markAtk:1.25, markCast:1.25',
            'markRhythmHits:3, markRhythmDmg:18, markRhythmCdCut:gs(.75)',
            'function tanMarkRhythm(f,e)',
            "tanBanner(f,'HINOKAMI RHYTHM','#FF7A3D')",
            'Hinokami Rhythm'
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('index verification failed: '+repr(missing))
          if "mark.rhythmDamage===98" not in t: raise SystemExit('Tanjiro rhythm contract assertion missing')
          print('Tanjiro Mark buff verification OK')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html play.html tools/t_tanjiro.js CLAUDE.md
          git commit -m 'balance: strengthen Tanjiro Demon Slayer Mark'
          git push origin HEAD:balance/tanjiro-mark-buff
