name: Inspect Isagi and Tsubasa ball tuning

on:
  push:
    branches:
      - balance/isagi-ball-nerf

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Isagi ball tuning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/isagi-ball-nerf
      - name: Inspect relevant code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=['const BALL_SPD','const BIC_SPD','function driveShot','function ballHit','function drawProj','function isagiFireBall','function isagiShotsTick','function drawIsagiFx']
          for n in needles:
              i=s.find(n)
              print('\n===== '+n+' =====')
              print(s[max(0,i-1200):i+3500] if i>=0 else 'NOT FOUND')
          PY
