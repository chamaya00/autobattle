name: One-shot Gojo fine tune

on:
  push:
    branches: [balance/gojo-fine-tune]
    paths:
      - '.github/workflows/gojo-fine-tune.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Gojo fine tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  n=s.count(old)
                  if n < 1:
                      raise SystemExit(f'{path}: missing expected text: {old[:140]!r}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          patch('index.html', [
            ('basic:[18,18,28], basicCd:gs(.75), basicRange:92, basicStun:gs(.3), basicPull:48,',
             'basic:[18,18,28], basicCd:gs(.75), basicRange:92, basicStun:gs(.25), basicPull:48,'),
            ('overloadT:gs(2), overwhelmedT:gs(3), overwhelmedMove:.65, overwhelmedAtk:.75, overwhelmedCast:.75,',
             'overloadT:gs(2.5), overwhelmedT:gs(4), overwhelmedMove:.50, overwhelmedAtk:.60, overwhelmedCast:.60,'),
            ('pw:{dmg:68,dur:78,mob:61,as:72,rng:78,cc:84,uti:82,con:74,cmb:20},',
             'pw:{dmg:88,dur:78,mob:56,as:64,rng:92,cc:74,uti:82,con:88,cmb:20},'),
            ('`<b>Basic · Limitless Combat</b> One strike every ${rts(GOJO.basicCd)}s: ${GOJO.basic.join(\' / \')} = ${GOJO.basic.reduce((a,b)=>a+b,0)} damage. Blue-Enhanced Strike lightly pulls the target and applies ${rts(GOJO.basicStun)}s hit stun, but never restores Infinity.`',
             '`<b>Basic · Limitless Combat</b> One strike every ${rts(GOJO.basicCd)}s: ${GOJO.basic.join(\' / \')} = ${GOJO.basic.reduce((a,b)=>a+b,0)} damage. Every landed strike applies ${rts(GOJO.basicStun)}s hit stun; the third Blue-Enhanced Strike also lightly pulls the target. Basic hits never restore Infinity.`'),
            ("{tag:'1',name:'Limitless Combat',vi:`Three close strikes for ${GOJO.basic.join(' / ')} damage. Blue-Enhanced Strike pulls lightly and applies ${rts(GOJO.basicStun)}s hit stun without restoring Infinity.`,en:`Three close strikes for ${GOJO.basic.join(' / ')} damage. Blue-Enhanced Strike pulls lightly and applies ${rts(GOJO.basicStun)}s hit stun without restoring Infinity.`}",
             "{tag:'1',name:'Limitless Combat',vi:`Three close strikes for ${GOJO.basic.join(' / ')} damage. Every landed strike applies ${rts(GOJO.basicStun)}s hit stun; the third Blue-Enhanced Strike also pulls lightly. Basic hits never restore Infinity.`,en:`Three close strikes for ${GOJO.basic.join(' / ')} damage. Every landed strike applies ${rts(GOJO.basicStun)}s hit stun; the third Blue-Enhanced Strike also pulls lightly. Basic hits never restore Infinity.`}"),
            ("  if(hit&&i===2){\n    knock(e,f.x-e.x,f.y-e.y,GOJO.basicPull); stunFx(e,GOJO.basicStun,'spin');\n    gojoBanner(f,'BLUE-ENHANCED STRIKE','#78D9FF');\n  }",
             "  if(hit){\n    stunFx(e,GOJO.basicStun,'spark');\n    if(i===2){\n      knock(e,f.x-e.x,f.y-e.y,GOJO.basicPull);\n      gojoBanner(f,'BLUE-ENHANCED STRIKE','#78D9FF');\n    }\n  }"),
          ])

          patch('tools/t_gojo.js', [
            ('basicCd:X.basicCd*RT,blue:[X.blueDmg,X.blueSplash,X.blueCd*RT,X.blueWind*RT,X.blueStun*RT],',
             'basicCd:X.basicCd*RT,basicStun:X.basicStun*RT,blue:[X.blueDmg,X.blueSplash,X.blueCd*RT,X.blueWind*RT,X.blueStun*RT],'),
            ("ok(near(cfg.entrance,1.5)&&cfg.basic.join('/')==='18/18/28'&&cfg.basicCd===.75,\n    'entrance and Limitless Combat values are exact');",
             "ok(near(cfg.entrance,1.5)&&cfg.basic.join('/')==='18/18/28'&&cfg.basicCd===.75&&cfg.basicStun===.25,\n    'entrance and Limitless Combat values are exact');"),
            ("ok(cfg.purple.join('/')==='150/0.6/22/1.6/4'&&cfg.domain.join('/')==='32/1.2/0.8/2/3',",
             "ok(cfg.purple.join('/')==='150/0.6/22/1.6/4'&&cfg.domain.join('/')==='32/1.2/0.8/2.5/4',"),
            ("ok(cfg.chart.cmb<=25&&cfg.chart.cc>=80&&cfg.chart.dur<=80,'power chart reflects no low-HP comeback and strong but bounded control');",
             "ok(cfg.chart.cmb<=25&&cfg.chart.dmg>=80&&cfg.chart.rng>=80&&cfg.chart.con>=80&&cfg.chart.cc>=72&&cfg.chart.cc<=76&&cfg.chart.as<70&&cfg.chart.mob<60,'power chart matches the requested burst/range/consistency profile');"),
            ("ok(domain.damage===0&&near(domain.over,2,.04)&&near(domain.stun,2,.04),\n    'Unlimited Void applies 2s Information Overload and deals 0 damage');",
             "ok(domain.damage===0&&near(domain.over,2.5,.04)&&near(domain.stun,2.5,.04),\n    'Unlimited Void applies 2.5s Information Overload and deals 0 damage');"),
            ("ok(near(domain.overwhelmed,3,.04)&&domain.move===.65&&domain.cast===.75,\n    'Information Overload transitions to 3s Overwhelmed: −35% move, −25% attack/cast');",
             "ok(near(domain.overwhelmed,4,.04)&&domain.move===.5&&domain.cast===.6,\n    'Information Overload transitions to 4s Overwhelmed: −50% move, −40% attack/cast');"),
          ])

          patch('CLAUDE.md', [
            ('`Limitless Combat` là basic 18/18/28 ở nhịp 0.75 giây. Hit thứ ba kéo nhẹ + hit stun,\n  nhưng không hồi Infinity.',
             '`Limitless Combat` là basic 18/18/28 ở nhịp 0.75 giây. Mỗi hit trúng gây 0.25 giây hit stun;\n  hit thứ ba còn kéo nhẹ mục tiêu, nhưng basic không hồi Infinity.'),
            ('`Information Overload` 2 giây; sau đó `Overwhelmed` 3 giây (−35% move, −25% attack/cast).',
             '`Information Overload` 2.5 giây; sau đó `Overwhelmed` 4 giây (−50% move, −40% attack/cast).'),
          ])
          PY

          python3 tools/mk_play.py

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'basicStun:gs(.25)',
            'overloadT:gs(2.5), overwhelmedT:gs(4), overwhelmedMove:.50, overwhelmedAtk:.60, overwhelmedCast:.60',
            'pw:{dmg:88,dur:78,mob:56,as:64,rng:92,cc:74,uti:82,con:88,cmb:20}',
            "stunFx(e,GOJO.basicStun,'spark')",
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('verification failed: '+repr(missing))
          print('Gojo fine tune verification OK')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html play.html tools/t_gojo.js CLAUDE.md
          git commit -m 'balance: fine tune Gojo control profile'
          git push origin HEAD:balance/gojo-fine-tune
