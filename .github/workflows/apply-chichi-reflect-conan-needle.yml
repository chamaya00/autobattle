name: Apply ChiChi Conan needle reflection

on:
  push:
    branches: [balance/chichi-reflect-conan-needle]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply ChiChi Conan needle reflection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/chichi-reflect-conan-needle
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Patch ChiChi needle reflection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          old="'Scolding — 5 shockwaves, reflects shuriken / kunai / ball / Air Cannon / Ginyu&apos;s Beam'"
          new="'Scolding — 5 shockwaves, reflects shuriken / kunai / ball / Air Cannon / Ginyu&apos;s Beam / Conan&apos;s tranquilizer needle'"
          assert old in s, 'ChiChi compact Scolding copy not found'
          s=s.replace(old,new,1)

          old_vi='phản ngược shuriken, kunai, bóng, vòng khí Air Cannon và luồng khí tím của Ginyu về phía địch.'
          new_vi='phản ngược shuriken, kunai, bóng, vòng khí Air Cannon, luồng khí tím của Ginyu và kim gây mê của Conan về phía địch.'
          assert old_vi in s, 'ChiChi detailed Scolding copy not found'
          s=s.replace(old_vi,new_vi,1)

          old_desc="Damage does not wake the target early. When Sleep ends, the target becomes <b>Groggy</b> for ${rts(CONAN.groggyT)}s.`"
          new_desc="Damage does not wake the target early. When Sleep ends, the target becomes <b>Groggy</b> for ${rts(CONAN.groggyT)}s. <b>ChiChi's Scolding can reflect this needle</b>; if the reflected needle hits Conan, he suffers the same Sleep → Groggy sequence.`"
          assert old_desc in s, 'Conan Wristwatch copy not found'
          s=s.replace(old_desc,new_desc,1)

          pat=r"function conanShotsTick\(f,dt\)\{.*?\n\}\nfunction conanTick\(f,dt\)\{"
          m=re.search(pat,s,flags=re.S)
          assert m, 'conanShotsTick not found'
          new_func=r'''function conanShotsTick(f,dt){
  if(!Array.isArray(f.conanShots))f.conanShots=[];
  for(let i=f.conanShots.length-1;i>=0;i--){
    const p=f.conanShots[i]; p.life-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    let gone=p.life<=0||p.y<PAD-20||p.y>H-PAD+20||p.x<PAD-35||p.x>W-PAD+35;

    /* Conan's tranquilizer is intentionally NOT part of the shared PHYSICAL reflect set.
       Only a live Scolding wave owned by ChiChi may turn it around, so no other fighter,
       barrier or generic projectile-reflect rule can bounce this needle. */
    if(!gone&&p.type==='needle'&&!p.reflected){
      for(const w of G.waves){
        if(!w||!w.owner||w.owner.key!=='chichi'||w.team===f.team)continue;
        if(dist(p,w)>=w.r+p.r)continue;
        const a=Math.atan2(p.y-w.y,p.x-w.x)+rnd(-.25,.25), sp=Math.hypot(p.vx,p.vy)||CONAN.needleSpeed;
        p.vx=Math.cos(a)*sp*1.15; p.vy=Math.sin(a)*sp*1.15;
        p.reflected=true; p.reflector=w.owner; p.life=Math.max(p.life,gs(2));
        G.floats.push({x:p.x,y:p.y-16,txt:'NEEDLE REFLECTED',color:w.owner.color,life:.8,ml:.8,banner:true,sc:.46});
        break;
      }
    }

    /* Once ChiChi has reflected the needle, it can only backfire on the Conan who fired
       it. It does not grant a Clue. If it actually collides and hurt() accepts the hit,
       Conan receives his own full 3s Sleep -> 3s Groggy sequence. */
    if(!gone&&p.type==='needle'&&p.reflected){
      if(f.alive&&hitsBody(p,f)){
        const hit=hurt(f,CONAN.needleDmg,p.reflector||f,false,'conanNeedleReflected');
        if(hit){
          f.conanSleep=CONAN.sleepT; f.conanGroggy=0;
          G.floats.push({x:f.x,y:f.y-104,txt:'ASLEEP',color:'#91A6D8',life:1,ml:1,banner:true,sc:.55});
        }
        gone=true;
      }
    }else if(!gone){
      for(const o of G.fighters){
        if(!foeOk(f,o)||!hitsBody(p,o))continue;
        if(p.type==='kick'){
          const hit=hurt(o,CONAN.kickDmg,f,'SOCCER BALL SHOT','conanKick');
          if(hit){knock(o,p.vx,p.vy,CONAN.kickKb);stunFx(o,CONAN.kickStun,'spin');}
        }else if(p.type==='needle'){
          const hit=hurt(o,CONAN.needleDmg,f,false,'conanNeedle');
          if(hit){
            conanAddClue(f,o,'STUN-GUN WRISTWATCH');
            o.conanSleep=CONAN.sleepT; o.conanGroggy=0;
            G.floats.push({x:o.x,y:o.y-104,txt:'ASLEEP',color:'#91A6D8',life:1,ml:1,banner:true,sc:.55});
          }
        }
        gone=true; break;
      }
    }
    if(gone)f.conanShots.splice(i,1);
  }
}
function conanTick(f,dt){'''
          s=s[:m.start()]+new_func+s[m.end():]
          p.write_text(s)

          r=Path('README.md')
          rs=r.read_text()
          old_r='Stun-Gun Wristwatch 2 / 12s and +1 auxiliary Clue on hit with immediate 3s Sleep, no damage-based early wake, then 3s Groggy;'
          new_r='Stun-Gun Wristwatch 2 / 12s and +1 auxiliary Clue on hit with immediate 3s Sleep, no damage-based early wake, then 3s Groggy; ChiChi Scolding alone can reflect the tranquilizer needle, and a reflected needle that hits Conan applies the same Sleep → Groggy sequence to him;'
          assert old_r in rs, 'README Conan Wristwatch summary not found'
          r.write_text(rs.replace(old_r,new_r,1))

          t=Path('tools/t_conan.js')
          ts=t.read_text()
          anchor="lacks('conanDrowsy','no drowsy pre-phase');\n"
          assert anchor in ts, 'Conan contract anchor not found'
          extra="""has(\"w.owner.key!=='chichi'\",'only ChiChi Scolding can reflect the tranquilizer needle');
has(\"p.type==='needle'&&!p.reflected\",'unreflected needle checks ChiChi waves');
has(\"hurt(f,CONAN.needleDmg,p.reflector||f,false,'conanNeedleReflected')\",'reflected needle can hit Conan');
has(\"f.conanSleep=CONAN.sleepT; f.conanGroggy=0;\",'reflected needle gives Conan the same sleep');
has('it does not grant a Clue','reflected needle cannot farm clues');
"""
          t.write_text(ts.replace(anchor,anchor+extra,1))
          PY
          python3 tools/mk_play.py
      - name: Validate
        run: |
          node tools/t_conan.js
          node tools/t_play.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          for f in ['index.html','play.html']:
              text=Path(f).read_text()
              for js in re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S|re.I):
                  fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd)
                  Path(path).write_text(js)
                  subprocess.run(['node','--check',path],check=True,stdout=subprocess.DEVNULL)
                  os.unlink(path)
          PY
      - name: Commit clean change
        run: |
          rm .github/workflows/apply-chichi-reflect-conan-needle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html play.html README.md tools/t_conan.js .github/workflows/apply-chichi-reflect-conan-needle.yml
          git commit -m "Let ChiChi reflect Conan tranquilizer needle"
          git push origin HEAD:balance/chichi-reflect-conan-needle
