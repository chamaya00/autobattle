name: Inspect Isagi integration points
on:
  push:
    branches: [feature/isagi-yoichi]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/isagi-yoichi
      - name: Inspect exact ranges
        run: |
          for r in '1940,2310' '2815,3305' '3415,3685' '5650,6035' '12610,13165' '13745,14540' '17070,17180' '17620,17675'; do
            echo "=== RANGE $r ==="
            sed -n "${r}p" index.html
          done
